<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Roadmaps</title>
  <style>
    :root { --ink:#243027; --muted:#687269; --paper:#f4f1e8; --card:#fffdf7; --line:#d8d3c5; --accent:#936b3d; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
    main { width:min(880px,calc(100% - 40px)); margin:0 auto; padding:80px 0; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:10px 0 14px; font-family:Georgia,"Songti SC",serif; font-size:clamp(42px,7vw,72px); line-height:1; }
    .intro { margin:0 0 42px; color:var(--muted); font-size:17px; }
    .trip { display:block; padding:26px; color:inherit; text-decoration:none; background:var(--card); border:1px solid var(--line); border-radius:18px; transition:transform .18s ease,border-color .18s ease; }
    .trip:hover { transform:translateY(-2px); border-color:var(--accent); }
    .date { color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.08em; }
    h2 { margin:8px 0; font-family:Georgia,"Songti SC",serif; font-size:28px; }
    p { margin:0; color:var(--muted); line-height:1.7; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Roadmaps</div>
    <h1>旅行路书</h1>
    <p class="intro">按目的地查看已经整理的行程。</p>
    <a class="trip" href="./changbai-mountain/">
      <div class="date">2026.09.28 — 10.02</div>
      <h2>长白山 × 延吉</h2>
      <p>长春龙嘉进出，长白山北坡两晚，延吉两晚。</p>
    </a>
  </main>
</body>
</html>
